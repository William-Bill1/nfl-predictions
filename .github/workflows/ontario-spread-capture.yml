name: Ontario Spread Capture

# Immutable Ontario sportsbook spread captures (ontario_spreads.py), twice a
# week during the season:
#   - Wednesday 12:00 America/Toronto
#   - Sunday    09:00 America/Toronto
# GitHub cron is UTC-only, so each slot has two entries: one for EDT (UTC-4)
# and one for EST (UTC-5). ontario_spreads.py decides from the Toronto wall
# clock whether a slot is due. The entry an hour early does nothing; the one an
# hour late finds the slot already captured and makes no API call. A run that
# GitHub delays is still captured inside the slot's window and labelled "late"
# (windows: Wednesday until 15:00, Sunday until 11:00 Toronto); a slot with no
# capture shows as "missed" in `python ontario_spreads.py coverage`. A capture
# with no quotes at all ("empty") is committed as evidence, fails the run, and
# leaves the slot open for the next run inside the window.
#
# Opt-in: without the ODDS_API_KEY secret, no API calls are made.
# A failed capture fails the run (no continue-on-error), and so does a capture
# skipped to protect the shared credit reserve.
#
# After the sportsbook steps, the same run also archives ESPN's injury report
# (injury_reports.py, evidence only; see docs/INJURY_REPORT_ARCHIVE.md). Those
# steps are continue-on-error and can't change the sportsbook capture or the
# run's conclusion; an injury failure shows as an error annotation and in the
# run summary.

permissions:
  contents: write

on:
  schedule:
    - cron: '0 16 * 9-12,1-2 3'   # Wed 12:00 EDT
    - cron: '0 17 * 9-12,1-2 3'   # Wed 12:00 EST
    - cron: '0 13 * 9-12,1-2 0'   # Sun 09:00 EDT
    - cron: '0 14 * 9-12,1-2 0'   # Sun 09:00 EST
  workflow_dispatch:
    inputs:
      slot:
        description: "auto (the due slot, if any), wednesday_noon, sunday_morning, or ad_hoc"
        required: false
        default: auto

# One capture at a time, never cancelled midway. A run that waited in the queue
# moves to the latest main first ("Use the latest main"), so the second run of
# a slot sees the first one's committed capture and skips without calling the
# API; if that refresh fails, the run fails without capturing. (GitHub keeps at most one run pending here; an older pending run is
# cancelled when a newer one arrives.)
concurrency:
  group: ontario-spread-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      # A run checks out the commit main pointed at when it was triggered. If
      # it then waited behind another run of this workflow, that commit lacks
      # the other run's capture. Fast-forward to the latest main so the
      # already-captured check sees it. Fails closed: if main can't be fetched
      # and fast-forwarded, this step fails, so the capture step (and with it
      # any Odds API request) is skipped rather than run from a stale commit.
      # The upload and persistence-report steps still run.
      - name: Use the latest main
        id: refresh
        if: github.ref == 'refs/heads/main'
        run: |
          refresh() { git fetch --quiet --no-tags "$@" origin main && git merge --ff-only --quiet FETCH_HEAD; }
          # A shallow checkout may lack the common history; deepen once if needed.
          if { refresh --depth=50 || refresh --unshallow; } &&
             [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Using main at $(git rev-parse --short HEAD) (triggered at ${GITHUB_SHA::7})"
          else
            echo "::error::could not move to the latest main; not capturing from a possibly stale commit (no Odds API request made)"
            echo "- latest main: **refresh failed**, capture skipped (no API request)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture Ontario spreads
        id: capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SLOT: ${{ github.event.inputs.slot || 'auto' }}
        run: |
          set -o pipefail
          python ontario_spreads.py capture --slot "$SLOT" | tee "$RUNNER_TEMP/ontario_capture.txt"

      # Runs even when the capture step failed, so an empty capture (kept as
      # evidence; the run still fails) is committed too.
      - name: Commit new capture files
        id: commit
        if: >-
          always() && github.ref == 'refs/heads/main' &&
          (steps.capture.outputs.status == 'captured' || steps.capture.outputs.status == 'empty')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_files/ontario_spreads/captures
          if git diff --staged --quiet; then
            echo "::error::capture reported success but produced no new file"
            exit 1
          fi
          git commit -m "Ontario spread capture [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 10))
          done
          echo "::error::could not push the new capture"
          exit 1

      # Keeps a copy of any capture file even if the commit or push fails.
      - name: Upload capture files
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontario-spread-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: data_files/ontario_spreads/captures/*.json
          if-no-files-found: ignore
          retention-days: 90

      # The run's final word on whether new capture files reached main and the
      # artifact store. Any capture file still uncommitted at this point (push
      # failed, run on a branch, or a crash after writing) is reported, and the
      # run fails unless the file is at least in the artifact.
      - name: Report persistence
        if: always()
        env:
          STATUS: ${{ steps.capture.outputs.status }}
          REFRESH: ${{ steps.refresh.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          ARTIFACT: ontario-spread-capture-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pending=$(git status --porcelain --untracked-files=all -- data_files/ontario_spreads/captures | grep '\.json$' || true)
          unpushed=$(git log --oneline '@{u}..HEAD' -- data_files/ontario_spreads/captures 2>/dev/null || true)
          {
            echo "### Capture persistence"
            echo "- latest main: ${REFRESH:-n/a}; capture status: ${STATUS:-none}; commit step: ${COMMIT:-n/a}; artifact upload: ${UPLOAD:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$pending" ] && [ -z "$unpushed" ]; then
            echo "- no unpersisted capture files" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- NOT on main: $(echo $pending $unpushed)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$UPLOAD" = "success" ]; then
            echo "::error::Capture file(s) were not persisted to main; they are only in workflow artifact $ARTIFACT (kept 90 days) - re-commit them by hand"
            echo "- only in artifact **$ARTIFACT** ❌" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Capture file(s) were neither committed to main nor uploaded as an artifact - they are lost when this runner ends"
            echo "- not uploaded either ❌" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      # ---- Injury report archive (injury_reports.py): evidence only --------
      # Runs after every sportsbook step above has finished, so it cannot change
      # the sportsbook capture, its commit, eligibility, idempotency, retries or
      # Odds API credit use (it never sees ODDS_API_KEY and calls only ESPN's
      # public injuries feed). Every injury step is continue-on-error: an
      # injury failure is shown as an error annotation and in the summary but
      # never changes the run's conclusion, which the Windows dispatcher reads.
      # Same slot rules as the sportsbook capture, judged at the time the
      # injury response actually arrived; skipped (like the capture) when the
      # run couldn't move to the latest main.
      - name: Capture injury report
        id: injury
        if: always() && steps.refresh.outcome != 'failure'
        continue-on-error: true
        env:
          SLOT: ${{ github.event.inputs.slot || 'auto' }}
        run: |
          set -o pipefail
          python injury_reports.py capture --slot "$SLOT" | tee "$RUNNER_TEMP/injury_capture.txt"

      # Commits only the one file this run's capture step wrote (its path comes
      # from the step's output), and only when the sportsbook steps left
      # nothing unpushed: it never pushes a sportsbook commit on their behalf.
      - name: Commit injury report capture
        id: injury_commit
        if: always() && github.ref == 'refs/heads/main' && steps.injury.outputs.written == 'true'
        continue-on-error: true
        env:
          FILE: ${{ steps.injury.outputs.file }}
        run: |
          if [ -n "$(git log --oneline '@{u}..HEAD' 2>/dev/null)" ]; then
            echo "::error::unpushed sportsbook commits present; injury capture not committed (kept in the artifact)"
            exit 1
          fi
          case "$FILE" in
            data_files/injury_reports/captures/*.json) ;;
            *) echo "::error::unexpected injury capture path '$FILE'; not committing"; exit 1 ;;
          esac
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- "$FILE"
          if [ "$(git diff --staged --name-only)" != "$FILE" ]; then
            echo "::error::staged paths are not exactly this run's injury capture; not committing"
            exit 1
          fi
          git commit -m "Injury report capture [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 10))
          done
          echo "::error::could not push the injury capture (committed locally only)"
          exit 1

      # if-no-files-found: error, so "success" means this run's file is in the artifact.
      - name: Upload injury report capture
        id: injury_upload
        if: always() && steps.injury.outputs.written == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: injury-report-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.injury.outputs.file }}
          if-no-files-found: error
          retention-days: 90

      # Verifies against a fresh fetch of remote main that this run's file is
      # there with identical content (sha256). A clean working tree is not
      # taken as proof: a local commit whose push failed is reported as such.
      # Persisted remotely / committed locally only / never committed /
      # remote unverified, each with whether the artifact holds a copy.
      - name: Report injury capture persistence
        if: always() && steps.injury.outcome != 'skipped'
        continue-on-error: true
        env:
          STATUS: ${{ steps.injury.outputs.status }}
          WRITTEN: ${{ steps.injury.outputs.written }}
          FILE: ${{ steps.injury.outputs.file }}
          SHA256: ${{ steps.injury.outputs.sha256 }}
          UPLOAD: ${{ steps.injury_upload.outcome }}
          ARTIFACT: injury-report-capture-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python injury_reports.py persistence --status "$STATUS" --written "$WRITTEN" \
            --file "$FILE" --sha256 "$SHA256" --upload "$UPLOAD" --artifact "$ARTIFACT"

      - name: Slot coverage (last 28 days)
        if: always() && steps.refresh.outcome != 'failure'
        run: |
          echo "### Slot coverage (last 28 days)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python ontario_spreads.py coverage --days 28 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
