[pytest]
# Only collect the real test suite. `scripts/` contains diagnostic helpers named
# test_*.py (e.g. test_model_performance_all_weeks.py) whose module bodies run
# analysis on import - collecting them made every `pytest` invocation execute
# backtests and write data_files/accuracy_results_*.json as a side effect.
testpaths = tests
norecursedirs = scripts data_files docs venv .venv .git *.egg build dist

# Put the repo root on sys.path so tests can `import season_utils` /
# `import betting_log` / `from player_props...`. Without this, a bare `pytest`
# (as CI runs it) fails collection - only `python -m pytest` happened to work,
# because that form prepends the CWD.
pythonpath = .

addopts = -ra
